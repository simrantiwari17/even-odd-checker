<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even Odd Checker</title>
</head>

<body>

    <h1>Is the number odd or even?</h1>
    <input type="number" id="input_number">
    <h1>Result:</h1>
    <input type="text" name="result_display" id="result_display">
    <br><br>
    <button id="result_btn">CHECK</button>

</body>

</html>
<style>
    body {
        text-align: center;
        background-color: darkgrey;

    }

    h1 {
        font-size: 55px;
        padding-top: 50px;
    }

    input {
        padding-top: 65px;
        width: 250px;
        border: 2px solid black;
        font-size: 40px;
        text-align: center;
    }

    button {
        width: 150px;
        height: 50px;
        margin-top: 25px;
        font-weight: 900;
        font-size: 25px;
        border: 2px solid black;
        background-color: cadetblue;
    }

    button:hover {
        background-color: cornflowerblue;
    }
</style>
<script>
    let inp = document.getElementById('input_number');
    
    let btn = document.getElementById('result_btn');
    let display = document.getElementById('result_display');

    btn.addEventListener('click', event = () => {

        let user_input = inp.value;

        if (user_input === "") {
            display.style.border = "2px solid red";
            input_number.style.border = "2px solid red";
            display.value = "Please Enter a NUMBER!";
        }
        else {
            user_input = parseInt(user_input);
            if (user_input % 2 === 0) {
                display.value = "Even";
                display.style.border = "2px solid black";
                inp.style.border = "2px solid black";

            }
            else {
                display.value = "Odd";
                display.style.border = "2px solid black";
                inp.style.border = "2px solid black";

            }
        }
    });
</script>
